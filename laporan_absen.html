<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Matriks Absensi - SmartAbsen Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @media print {
            body { background: white; color: black; padding: 0; }
            .no-print { display: none !important; }
            .print-card { box-shadow: none !important; border: none !important; }
            table { font-size: 11px; }
        }
        .sticky-col {
            position: -webkit-sticky;
            position: sticky;
            left: 0;
            background-color: #f8fafc;
            z-index: 10;
        }
        thead th.sticky-col {
            background-color: #0f172a;
            color: white;
            z-index: 20;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen">

    <header class="no-print bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-3 shadow-xs">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold text-slate-900">SmartAbsen <span class="text-blue-600">Pro</span></span>
                <span class="bg-blue-50 text-blue-700 text-xs font-semibold px-2.5 py-0.5 rounded-sm border border-blue-100">Jurnal Google Sheet</span>
            </div>
            <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition">← Kembali</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        
        <div class="text-center md:text-left border-b border-slate-200 pb-4">
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">JURNAL REKAPITULASI PRESENSI SISWA</h1>
            <p id="sub-judul" class="text-sm text-slate-500 mt-1">Menghubungkan ke database Google Sheet...</p>
        </div>

        <div class="no-print bg-white rounded-xl shadow-xs border border-slate-200 p-5 grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Pilih Kelas *</label>
                <select id="filter-kelas" disabled class="w-full bg-slate-100 border border-slate-200 rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                    <option value="">-- Memuat Data... --</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Pilih Mapel *</label>
                <select id="filter-mapel" disabled class="w-full bg-slate-100 border border-slate-200 rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                    <option value="">-- Memuat Data... --</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Mulai Bulan</label>
                <input type="month" id="filter-bulan-awal" disabled class="w-full bg-slate-100 border border-slate-200 rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Sampai Bulan</label>
                <input type="month" id="filter-bulan-akhir" disabled class="w-full bg-slate-100 border border-slate-200 rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>
            
            <div class="md:col-span-4 flex justify-end pt-2">
                <button onclick="window.print()" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2 px-5 rounded-lg text-sm shadow-xs flex items-center gap-2 transition">
                    🖨️ Cetak Jurnal (PDF)
                </button>
            </div>
        </div>

        <div class="bg-white border border-slate-200 rounded-xl shadow-xs overflow-hidden print-card">
            <div class="overflow-x-auto max-w-full">
                <table class="w-full text-left border-collapse min-w-max">
                    <thead id="table-head"></thead>
                    <tbody id="table-body" class="divide-y divide-slate-200 text-sm text-slate-700"></tbody>
                </table>
            </div>

            <div id="filter-prompt" class="text-center py-12 bg-white">
                <div id="prompt-icon" class="text-slate-300 text-5xl mb-2">⏳</div>
                <h3 id="prompt-title" class="text-base font-bold text-slate-700">Menghubungkan ke Google Sheet...</h3>
                <p id="prompt-desc" class="text-xs text-slate-400 max-w-xs mx-auto mt-1">Mengunduh riwayat log presensi.</p>
            </div>
        </div>
    </main>

    <script>
        // Gunakan URL Publikasi Google Sheet Anda di sini
        const URL_GOOGLE_SHEET = "https://docs.google.com/spreadsheets/d/1UzqWGBKjHNcnBSz3UexIktAF7JY5-E13qiAo5AIXo2o/edit?gid=525895331#gid=525895331";

        let DATA_LOG_ABSEN = [];

        const filterKelas = document.getElementById('filter-kelas');
        const filterMapel = document.getElementById('filter-mapel');
        const filterBulanAwal = document.getElementById('filter-bulan-awal');
        const filterBulanAkhir = document.getElementById('filter-bulan-akhir');
        const tableHead = document.getElementById('table-head');
        const tableBody = document.getElementById('table-body');
        const filterPrompt = document.getElementById('filter-prompt');
        const promptIcon = document.getElementById('prompt-icon');
        const promptTitle = document.getElementById('prompt-title');
        const promptDesc = document.getElementById('prompt-desc');
        const subJudul = document.getElementById('sub-judul');

        document.addEventListener("DOMContentLoaded", ambilDataGoogleSheet);

        [filterKelas, filterMapel, filterBulanAwal, filterBulanAkhir].forEach(el => {
            el.addEventListener('change', generateMatrixTable);
        });

        function ambilDataGoogleSheet() {
            fetch(URL_GOOGLE_SHEET)
                .then(response => response.text())
                .then(text => prosesDataCSV(text))
                .catch(error => {
                    console.error(error);
                    promptIcon.innerText = "❌";
                    promptTitle.innerText = "Koneksi Google Sheet Gagal";
                    promptDesc.innerText = "Periksa kembali setelan publikasi CSV di Google Sheets Anda.";
                });
        }

        // Fungsi Parser CSV Standar Industri yang Menjamin Keamanan Kolom Teks ber-Spasi/Koma
        function parseCSVLine(text) {
            let p = false, r = [''], c = 0;
            for (let i = 0; i < text.length; i++) {
                let el = text[i], next = text[i+1];
                if (el == '"') { if (p && next == '"') { r[c] += '"'; i++; } else { p = !p; } }
                else if (el == ',' && !p) { r[++c] = ''; }
                else if ((el == '\r' || el == '\n') && !p) { break; }
                else { r[c] += el; }
            }
            return r;
        }

        function prosesDataCSV(text) {
            DATA_LOG_ABSEN = [];
            const lines = text.split(/\r?\n/);
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                // Memakai Parser Aman
                const columns = parseCSVLine(line);
                
                if (columns.length >= 5) {
                    const tglWaktu = columns[0].trim(); 
                    const tglSaja = tglWaktu.split(' ')[0]; 
                    const kelas = columns[1].trim();
                    const mapel = columns[2].trim();
                    const nama = columns[3].trim();
                    const status = columns[4].trim();

                    // Mencegah baris header ikut terbaca masuk dropdown
                    if (!kelas || !nama || kelas.toLowerCase() === "kelas" || nama.toLowerCase() === "nama siswa" || tglWaktu.toLowerCase().includes("timestamp")) {
                        continue;
                    }

                    DATA_LOG_ABSEN.push({
                        tanggal: tglSaja,
                        kelas: kelas,
                        mapel: mapel,
                        nama: nama,
                        status: status
                    });
                }
            }

            if (DATA_LOG_ABSEN.length > 0) {
                [filterKelas, filterMapel, filterBulanAwal, filterBulanAkhir].forEach(el => {
                    el.disabled = false;
                    el.classList.remove('bg-slate-100');
                });
                
                setupDropdowns();
                
                promptIcon.innerText = "📊";
                promptTitle.innerText = "Data Berhasil Disinkronkan!";
                promptDesc.innerText = "Silakan tentukan Kelas dan Mata Pelajaran untuk menyusun jurnal presensi.";
                subJudul.innerText = `Terhubung ke Google Sheet. Menampung ${DATA_LOG_ABSEN.length} log kehadiran.`;
            }
        }

        function setupDropdowns() {
            const listKelas = [...new Set(DATA_LOG_ABSEN.map(item => item.kelas))].filter(Boolean).sort();
            const listMapel = [...new Set(DATA_LOG_ABSEN.map(item => item.mapel))].filter(Boolean).sort();

            filterKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
            filterMapel.innerHTML = '<option value="">-- Pilih Mapel --</option>';

            listKelas.forEach(k => filterKelas.options.add(new Option(k, k)));
            listMapel.forEach(m => filterMapel.options.add(new Option(m, m)));
        }

        function dapatkanFormatBulan(stringTanggal) {
            const bagian = stringTanggal.split('/');
            if(bagian.length === 3) {
                const tahun = bagian[2];
                const bulan = bagian[0].padStart(2, '0');
                return `${tahun}-${bulan}`;
            }
            return stringTanggal.substring(0, 7);
        }

        function generateMatrixTable() {
            const kelasAktif = filterKelas.value;
            const mapelAktif = filterMapel.value;
            const blnAwal = filterBulanAwal.value;
            const blnAkhir = filterBulanAkhir.value;

            if (!kelasAktif || !mapelAktif) {
                tableHead.innerHTML = "";
                tableBody.innerHTML = "";
                filterPrompt.classList.remove('hidden');
                return;
            }

            filterPrompt.classList.add('hidden');
            subJudul.innerText = `Kelas: ${kelasAktif} | Mata Pelajaran: ${mapelAktif}`;

            const dataDisaring = DATA_LOG_ABSEN.filter(item => {
                const blnItem = dapatkanFormatBulan(item.tanggal);
                return item.kelas === kelasAktif &&
                       item.mapel === mapelAktif &&
                       (!blnAwal || blnItem >= blnAwal) &&
                       (!blnAkhir || blnItem <= blnAkhir);
            });

            // Urutkan tanggal secara kronologis kalender
            const daftarTanggal = [...new Set(dataDisaring.map(item => item.tanggal))].sort((a,b) => new Date(a) - new Date(b));
            const daftarSiswa = [...new Set(dataDisaring.map(item => item.nama))].sort();

            // HEADER TABEL DENGAN REKAP STATUS MANDIRI H, D, I, S, A
            let headHTML = `
                <tr class="bg-slate-900 text-white text-xs font-bold uppercase tracking-wider border-b border-slate-200">
                    <th class="p-3 text-center w-12 bg-slate-950">No</th>
                    <th class="p-3 sticky-col min-w-[240px] bg-slate-950 text-left">Nama Lengkap Siswa</th>
                    ${daftarTanggal.map(tgl => {
                        const b = tgl.split('/');
                        const tglDisplay = b.length === 3 ? `${b[1]}/${b[0]}` : tgl;
                        return `<th class="p-3 text-center min-w-[65px] border-l border-slate-800">${tglDisplay}</th>`;
                    }).join('')}
                    <th class="p-3 text-center border-l border-slate-800 bg-emerald-950 text-emerald-400 font-bold min-w-[45px]">H</th>
                    <th class="p-3 text-center border-l border-slate-700 bg-sky-950 text-sky-400 font-bold min-w-[45px]">D</th>
                    <th class="p-3 text-center border-l border-slate-700 bg-indigo-950 text-indigo-400 font-bold min-w-[45px]">I</th>
                    <th class="p-3 text-center border-l border-slate-700 bg-amber-950 text-amber-400 font-bold min-w-[45px]">S</th>
                    <th class="p-3 text-center border-l border-slate-700 bg-rose-950 text-rose-400 font-bold min-w-[45px]">A</th>
                </tr>
            `;
            tableHead.innerHTML = headHTML;

            tableBody.innerHTML = "";
            if (daftarSiswa.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="${daftarTanggal.length + 7}" class="p-8 text-center text-slate-400 text-xs">Tidak ditemukan riwayat data presensi siswa untuk filter ini.</td></tr>`;
                return;
            }

            daftarSiswa.forEach((siswa, index) => {
                let hitungH = 0, hitungD = 0, hitungI = 0, hitungS = 0, hitungA = 0;

                let kolomStatusHTML = daftarTanggal.map(tgl => {
                    const cocok = dataDisaring.find(item => item.nama === siswa && item.tanggal === tgl);
                    let statusRaw = cocok ? cocok.status.trim().toLowerCase() : "-";
                    let statusSingkat = "-";

                    if (statusRaw === "hadir") { statusSingkat = "H"; hitungH++; }
                    else if (statusRaw === "dispen" || statusRaw === "dispensasi") { statusSingkat = "D"; hitungD++; }
                    else if (statusRaw === "izin" || statusRaw === "ijin") { statusSingkat = "I"; hitungI++; }
                    else if (statusRaw === "sakit") { statusSingkat = "S"; hitungS++; }
                    else if (statusRaw === "alpa" || statusRaw === "alpha") { statusSingkat = "A"; hitungA++; }

                    let warnaTeks = "text-slate-300";
                    if (statusSingkat === "H") warnaTeks = "text-emerald-600 font-bold";
                    if (statusSingkat === "D") warnaTeks = "text-sky-600 font-bold";
                    if (statusSingkat === "I") warnaTeks = "text-indigo-600 font-bold";
                    if (statusSingkat === "S") warnaTeks = "text-amber-600 font-bold";
                    if (statusSingkat === "A") warnaTeks = "text-rose-600 font-bold";

                    return `<td class="p-3 text-center border-l border-slate-100 ${warnaTeks}">${statusSingkat}</td>`;
                }).join('');

                let rowHTML = `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 text-center font-mono text-xs text-slate-400 bg-slate-100/50">${index + 1}</td>
                        <td class="p-3 font-semibold text-slate-900 sticky-col border-r border-slate-200">${siswa}</td>
                        ${kolomStatusHTML}
                        <td class="p-3 text-center border-l border-slate-200 bg-emerald-50 text-emerald-800 font-bold">${hitungH}</td>
                        <td class="p-3 text-center border-l border-slate-100 bg-sky-50 text-sky-800 font-bold">${hitungD}</td>
                        <td class="p-3 text-center border-l border-slate-100 bg-indigo-50 text-indigo-800 font-bold">${hitungI}</td>
                        <td class="p-3 text-center border-l border-slate-100 bg-amber-50 text-amber-800 font-bold">${hitungS}</td>
                        <td class="p-3 text-center border-l border-slate-100 bg-rose-50 text-rose-800 font-bold">${hitungA}</td>
                    </tr>
                `;
                tableBody.insertAdjacentHTML('beforeend', rowHTML);
            });
        }
    </script>
</body>
</html>
