<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Jurnal Absensi Bulanan - GitHub Hosting</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @media print {
            body { background: white; color: black; padding: 0; }
            .no-print { display: none !important; }
            .print-card { box-shadow: none !important; border: none !important; }
            table { font-size: 10px !important; width: 100% !important; border-collapse: collapse !important; }
            th, td { border: 1px solid #000000 !important; padding: 4px 2px !important; color: #000000 !important; text-align: center !important; }
            th.text-left, td.text-left { text-align: left !important; }
        }
        .sticky-col {
            position: -webkit-sticky;
            position: sticky;
            left: 0;
            background-color: #f8fafc;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen">

    <header class="no-print bg-slate-900 text-white sticky top-0 z-50 px-4 py-3 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-lg font-bold tracking-tight">SmartAbsen <span class="text-blue-400">Pro</span></span>
                <span class="bg-emerald-500 text-slate-900 text-[10px] font-bold px-2 py-0.5 rounded">GitHub Live Data Engine</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        
        <div class="text-center md:text-left border-b border-slate-300 pb-4">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight uppercase">JURNAL REKAPITULASI PRESENSI SISWA</h1>
            <p id="sub-judul" class="text-sm text-slate-500 mt-1 font-medium">Menghubungkan ke API Google Apps Script...</p>
        </div>

        <div class="no-print bg-white rounded-xl shadow-sm border border-slate-200 p-5 grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Pilih Kelas *</label>
                <select id="filter-kelas" disabled class="w-full bg-slate-100 border border-slate-200 rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                    <option value="">-- Memuat Kelas... --</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Pilih Mapel *</label>
                <select id="filter-mapel" disabled class="w-full bg-slate-100 border border-slate-200 rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                    <option value="">-- Memuat Mapel... --</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Filter Berdasarkan Bulan</label>
                <input type="month" id="filter-bulan" disabled class="w-full bg-slate-100 border border-slate-200 rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>
            
            <div class="flex items-end space-x-2">
                <button id="btn-tampilkan" disabled onclick="generateMatriksGithub()" class="flex-1 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold py-2.5 rounded-lg text-sm shadow-sm transition cursor-pointer">
                    🔍 Tampilkan
                </button>
                <button onclick="window.print()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm shadow-sm transition cursor-pointer flex items-center justify-center gap-1">
                    🖨️ Cetak PDF
                </button>
            </div>
        </div>

        <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden print-card p-4">
            <div class="overflow-x-auto max-w-full">
                <table class="w-full text-left border-collapse text-xs border border-slate-300">
                    <thead id="table-head"></thead>
                    <tbody id="table-body" class="divide-y divide-slate-200 text-slate-700"></tbody>
                </table>
            </div>

            <div id="filter-prompt" class="text-center py-12 bg-white">
                <div id="prompt-icon" class="text-slate-300 text-5xl mb-2">📥</div>
                <h3 id="prompt-title" class="text-base font-bold text-slate-700">Menghubungkan ke Server...</h3>
                <p id="prompt-desc" class="text-xs text-slate-400 max-w-xs mx-auto mt-1">Mengunduh data siswa dan log absensi dari ekosistem Google Sheets.</p>
            </div>
        </div>
    </main>

    <script>
        // Tautan Web App Google Apps Script Exec Utama Anda
        const URL_API_APPS_SCRIPT = "https://script.google.com/a/macros/guru.smk.belajar.id/s/AKfycbxqdybexWYFZRmm4bq5wKwubLN8mjq9n-ox3wguVrasE4kKl-AzcqnxdcoGtblguOFBJw/exec?action=ambilDataAbsen";

        let MASTER_SISWA = [];
        let MASTER_LOG = [];

        document.addEventListener("DOMContentLoaded", muatDataDariAPI);

        async function muatDataDariAPI() {
            try {
                const respon = await fetch(URL_API_APPS_SCRIPT);
                const hasil = await respon.json();

                if(hasil.error) { throw new Error(hasil.error); }

                // Olah Database Siswa (Baris 0 adalah Header)
                let dataSiswaRaw = hasil.siswa;
                let listKelas = [], listMapel = [];
                for(let i = 1; i < dataSiswaRaw.length; i++) {
                    let r = dataSiswaRaw[i];
                    if (r[1]) MASTER_SISWA.push({ id: r[0], nama: r[1], kelas: r[2] });
                    if (r[5]) listMapel.push(r[5]); // Kolom Mapel Pilihan
                    if (r[6]) listKelas.push(r[6]); // Kolom Daftar Kelas
                }

                // Olah Log Absen
                let dataLogRaw = hasil.log;
                for(let i = 1; i < dataLogRaw.length; i++) {
                    let r = dataLogRaw[i];
                    if(r[3]) {
                        // Memisahkan format Tanggal Jam (7/1/2026 19:32:37 -> 7/1/2026)
                        let tglSaja = r[0].toString().includes(' ') ? r[0].split(' ')[0] : r[0];
                        MASTER_LOG.push({ tanggal: tglSaja, kelas: r[1], mapel: r[2], nama: r[3], status: r[4] });
                    }
                }

                // Bangun Dropdown Pilihan
                const selK = document.getElementById('filter-kelas');
                const selM = document.getElementById('filter-mapel');
                selK.innerHTML = '<option value="">-- Pilih Kelas --</option>';
                selM.innerHTML = '<option value="">-- Pilih Mapel --</option>';

                [...new Set(listKelas)].filter(Boolean).sort().forEach(k => selK.options.add(new Option(k, k)));
                [...new Set(listMapel)].filter(Boolean).sort().forEach(m => selM.options.add(new Option(m, m)));

                // Aktifkan Kontrol Fitur
                [selK, selM, document.getElementById('filter-bulan'), document.getElementById('btn-tampilkan')].forEach(el => {
                    el.disabled = false;
                    el.classList.remove('bg-slate-100');
                });

                document.getElementById('sub-judul').innerText = `Koneksi API Berhasil. Sinkronisasi ${MASTER_SISWA.length} siswa aktif selesai.`;
                document.getElementById('filter-prompt').innerHTML = `<div class="text-slate-300 text-5xl mb-2">🔍</div><h3 class="text-base font-bold text-slate-700">Silakan Pilih Parameter Filter</h3><p class="text-xs text-slate-400">Pilih kombinasi kelas dan mapel lalu klik Tampilkan.</p>`;

            } catch (error) {
                console.error(error);
                document.getElementById('prompt-icon').innerText = "❌";
                document.getElementById('prompt-title').innerText = "Gagal Mengambil Data API";
                document.getElementById('prompt-desc').innerText = "Pastikan setelan deployment Google Apps Script Anda diatur aksesnya ke 'Anyone' (Siapa Saja).";
            }
        }

        function generateMatriksGithub() {
            const kAktif = document.getElementById('filter-kelas').value;
            const mAktif = document.getElementById('filter-mapel').value;
            const bAktif = document.getElementById('filter-bulan').value; // Format: YYYY-MM

            if (!kAktif || !mAktif) {
                alert("Mohon tentukan Kelas dan Mata Pelajaran terlebih dahulu!");
                return;
            }

            document.getElementById('filter-prompt').classList.add('hidden');
            document.getElementById('sub-judul').innerText = `Kelas: ${kAktif} | Mata Pelajaran: ${mAktiv}`;

            const siswaDisaring = MASTER_SISWA.filter(s => s.kelas === kAktif);
            
            const logDisaring = MASTER_LOG.filter(l => {
                let p = l.tanggal.split('/');
                let blnItem = p.length === 3 ? `${p[2]}-${p[0].padStart(2,'0')}` : l.tanggal.substring(0,7);
                return l.kelas === kAktif && l.mapel === mAktif && (!bAktif || blnItem === bAktif);
            });

            const tglList = [...new Set(logDisaring.map(l => l.tanggal))].sort((a,b) => new Date(a) - new Date(b));

            // Desain Baris Judul Kolom Tabel Jurnal
            document.getElementById('table-head').innerHTML = `
                <tr class="bg-slate-900 text-white font-bold uppercase border-b border-slate-300">
                    <th class="p-2 text-center w-12 bg-slate-950">No</th>
                    <th class="p-2 text-left sticky-col bg-slate-950 min-w-[200px]">Nama Lengkap Siswa</th>
                    ${tglList.map(t => `<th class="p-2 text-center border-l border-slate-700 min-w-[50px]">${t.substring(0,5)}</th>`).join('')}
                    <th class="p-2 text-center bg-emerald-950 text-emerald-400 font-bold border-l border-slate-700 w-10">H</th>
                    <th class="p-2 text-center bg-sky-950 text-sky-400 font-bold border-l border-slate-700 w-10">D</th>
                    <th class="p-2 text-center bg-indigo-950 text-indigo-400 font-bold border-l border-slate-700 w-10">I</th>
                    <th class="p-2 text-center bg-amber-950 text-amber-400 font-bold border-l border-slate-700 w-10">S</th>
                    <th class="p-2 text-center bg-rose-950 text-rose-400 font-bold border-l border-slate-700 w-10">A</th>
                </tr>
            `;

            // Isi Data Baris Siswa Mandiri
            const tBody = document.getElementById('table-body');
            tBody.innerHTML = "";

            if(siswaDisaring.length === 0) {
                tBody.innerHTML = `<tr><td colspan="${tglList.length + 7}" class="p-6 text-center text-slate-400">Tidak ada data siswa untuk kelas ${kAktif}</td></tr>`;
                return;
            }

            siswaDisaring.forEach((s, idx) => {
                let h=0, d=0, i=0, sKt=0, a=0;
                
                let tdStatus = tglList.map(t => {
                    let match = logDisaring.find(l => l.nama.toLowerCase() === s.nama.toLowerCase() && l.tanggal === t);
                    let st = match ? match.status.trim().toLowerCase() : "-";
                    let n = "-";
                    let c = "text-slate-300";

                    if(st === 'hadir') { n="H"; h++; c="text-emerald-600 font-bold"; }
                    else if(st === 'dispen' || st === 'dispensasi') { n="D"; d++; c="text-sky-600 font-bold"; }
                    else if(st === 'izin' || st === 'ijin') { n="I"; i++; c="text-indigo-600 font-bold"; }
                    else if(st === 'sakit') { n="S"; sKt++; c="text-amber-600 font-bold"; }
                    else if(st === 'alpa' || st === 'alpha') { n="A"; a++; c="text-rose-600 font-bold"; }

                    return `<td class="p-2 text-center border-l border-slate-200 ${c}">${n}</td>`;
                }).join('');

                let tr = `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-2 text-center font-mono bg-slate-100/50">${idx+1}</td>
                        <td class="p-2 text-left font-semibold sticky-col border-r border-slate-200">${s.nama}</td>
                        ${tdStatus}
                        <td class="p-2 text-center font-bold bg-emerald-50 text-emerald-800">${h}</td>
                        <td class="p-2 text-center font-bold bg-sky-50 text-sky-800">${d}</td>
                        <td class="p-2 text-center font-bold bg-indigo-50 text-indigo-800">${i}</td>
                        <td class="p-2 text-center font-bold bg-amber-50 text-amber-800">${sKt}</td>
                        <td class="p-2 text-center font-bold bg-rose-50 text-rose-800">${a}</td>
                    </tr>
                `;
                tBody.insertAdjacentHTML('beforeend', tr);
            });
        }
    </script>
</body>
</html>
