<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Presensi Online</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 font-sans p-4 md:p-6">

  <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-slate-200">
    <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center border-b pb-3">Formulir Presensi Siswa</h2>
    
    <div id="statusMessage" class="hidden p-3 mb-4 text-center font-medium rounded-md"></div>

    <form id="attendanceForm" onsubmit="submitPresensi(event)" class="space-y-5">
      
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Kelas</label>
        <select id="kelas" onchange="loadSiswa()" class="w-full p-2.5 border rounded-lg bg-white shadow-sm focus:ring-2 focus:ring-blue-500" required>
          <option value="">Memuat kelas...</option>
        </select>
      </div>
      
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Mata Pelajaran</label>
        <select id="mapel" class="w-full p-2.5 border rounded-lg bg-white shadow-sm focus:ring-2 focus:ring-blue-500" required>
          <option value="">Memuat mapel...</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Siswa</label>
        <select id="nama" class="w-full p-2.5 border rounded-lg bg-white shadow-sm focus:ring-2 focus:ring-blue-500" required disabled>
          <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Status Kehadiran</label>
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
          <label class="flex items-center justify-center p-2 border rounded-lg cursor-pointer bg-green-50 hover:bg-green-100 text-green-700 font-bold">
            <input type="radio" name="status" value="Hadir" class="mr-2" required> Hadir
          </label>
          <label class="flex items-center justify-center p-2 border rounded-lg cursor-pointer bg-yellow-50 hover:bg-yellow-100 text-yellow-700 font-bold">
            <input type="radio" name="status" value="Sakit" class="mr-2"> Sakit
          </label>
          <label class="flex items-center justify-center p-2 border rounded-lg cursor-pointer bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold">
            <input type="radio" name="status" value="Izin" class="mr-2"> Izin
          </label>
          <label class="flex items-center justify-center p-2 border rounded-lg cursor-pointer bg-red-50 hover:bg-red-100 text-red-700 font-bold">
            <input type="radio" name="status" value="Alpa" class="mr-2"> Alpa
          </label>
          <label class="flex items-center justify-center p-2 border rounded-lg cursor-pointer bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold col-span-2 sm:col-span-1">
            <input type="radio" name="status" value="Dispen" class="mr-2"> Dispen
          </label>
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition cursor-pointer">
          Kirim Presensi
        </button>
      </div>

    </form>
    
    <div class="mt-6 text-center text-sm">
      <a href="laporan_absen.html" class="text-blue-600 hover:underline font-medium">Lihat Laporan Rekapitulasi Absensi &rarr;</a>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURATION (PASTIKAN URL SUDAH SESUAI)
    // ==========================================
    // Masukkan URL Web App Google Apps Script (/exec) Anda di bawah ini:
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyo2UpV5gX_c5JP9TWCYboJQpXDnJp_BIUafelk9cxf7OxdQfEbi2lxnKGlChyGpud5/exec"; 
    // ^ Silakan ganti nilai di atas dengan URL /exec asli milik Apps Script terbaru Anda

    // Fungsi Utama Penanganan Lintas Domain (JSONP)
    function fetchJSONP(url, callbackFunc) {
      const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
      window[callbackName] = function(data) {
        delete window[callbackName];
        document.body.removeChild(script);
        callbackFunc(data);
      };
      
      const script = document.createElement('script');
      script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
      document.body.appendChild(script);
    }

    // Ambil Data Awal (Kelas & Mapel) Saat Halaman Pertama Dimuat
    window.onload = function() {
      fetchJSONP(`${WEB_APP_URL}?action=getInitialData`, function(options) {
        if (options.error) {
          showStatus("Gagal memuat database awal: " + options.error, "error");
          return;
        }
        
        const kelasSelect = document.getElementById('kelas');
        const mapelSelect = document.getElementById('mapel');
        
        kelasSelect.innerHTML = '<option value="">-- Pilih Kelas --</option>';
        mapelSelect.innerHTML = '<option value="">-- Pilih Mapel --</option>';
        
        options.kelas.forEach(k => { kelasSelect.innerHTML += `<option value="${k}">${k}</option>`; });
        options.mapel.forEach(m => { mapelSelect.innerHTML += `<option value="${m}">${m}</option>`; });
      });
    };

    // Ambil Nama Siswa Secara Dinamis Ketika Kelas Dipilih
    function loadSiswa() {
      const kelasRaw = document.getElementById('kelas').value;
      const siswaSelect = document.getElementById('nama');
      
      if (!kelasRaw) {
        siswaSelect.innerHTML = '<option value="">-- Pilih Kelas Terlebih Dahulu --</option>';
        siswaSelect.disabled = true;
        return;
      }
      
      siswaSelect.innerHTML = '<option value="">Memuat daftar siswa...</option>';
      siswaSelect.disabled = true;
      
      const kelas = encodeURIComponent(kelasRaw);
      fetchJSONP(`${WEB_APP_URL}?action=getSiswa&kelas=${kelas}`, function(listSiswa) {
        if (listSiswa.error) {
          showStatus("Gagal memuat daftar siswa: " + listSiswa.error, "error");
          return;
        }
        
        siswaSelect.innerHTML = '<option value="">-- Pilih Nama Siswa --</option>';
        listSiswa.forEach(s => { siswaSelect.innerHTML += `<option value="${s}">${s}</option>`; });
        siswaSelect.disabled = false;
      });
    }

    // Fungsi Pengiriman Data Presensi Baru (Menggunakan Metode GET dengan Trigger Parameter Laporan/POST Alternatif)
    function submitPresensi(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const kelas = encodeURIComponent(document.getElementById('kelas').value);
      const mapel = encodeURIComponent(document.getElementById('mapel').value);
      const nama = encodeURIComponent(document.getElementById('nama').value);
      const statusElement = document.querySelector('input[name="status"]:checked');
      
      if (!statusElement) {
        alert("Pilih status kehadiran terlebih dahulu!");
        return;
      }
      const status = encodeURIComponent(statusElement.value);

      // Mengubah tombol menjadi mode memproses data
      submitBtn.disabled = true;
      submitBtn.innerText = "Sedang Mengirim...";
      showStatus("Sedang mengamankan data presensi ke Google Sheets...", "info");

      // Menggunakan fetchJSONP untuk menyimpan data (Mencegah kendala CORS CORS Blokir pada metode Post)
      // Kita menembak gerbang doGet tetapi mengirim data parameter inputan lengkap
      const urlSubmit = `${WEB_APP_URL}?kelas=${kelas}&mapel=${mapel}&nama=${nama}&status=${status}`;
      
      fetchJSONP(urlSubmit, function(response) {
        submitBtn.disabled = false;
        submitBtn.innerText = "Kirim Presensi";
        
        if (response.status === "success" || response.message) {
          showStatus("Berhasil! Data presensi siswa telah tercatat di Google Sheets.", "success");
          document.getElementById('attendanceForm').reset();
          document.getElementById('nama').innerHTML = '<option value="">-- Pilih Kelas Terlebih Dahulu --</option>';
          document.getElementById('nama').disabled = true;
        } else {
          showStatus("Gagal mengirim data: " + (response.error || "Terjadi kesalahan internal"), "error");
        }
      });
    }

    // Fungsi Pembantu Notifikasi Tampilan Statis/Peringatan
    function showStatus(msg, type) {
      const box = document.getElementById('statusMessage');
      box.innerText = msg;
      box.classList.remove('hidden', 'bg-blue-100', 'text-blue-800', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
      
      if (type === "info") box.classList.add('bg-blue-100', 'text-blue-800');
      else if (type === "success") box.classList.add('bg-green-100', 'text-green-800');
      else if (type === "error") box.classList.add('bg-red-100', 'text-red-800');
      
      box.classList.remove('hidden');
    }
  </script>
</body>
</html>
