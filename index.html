<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAbsen Pro v2</title>
    <style>
        :root { --h: #28a745; --i: #ffc107; --s: #17a2b8; --a: #dc3545; --d: #6f42c1; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; padding: 15px; margin-bottom: 100px; }
        .container { max-width: 500px; margin: auto; }
        
        /* Header & Pilihan Menu */
        .header { background: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        select, .search-box { 
            width: 100%; padding: 12px; margin: 5px 0; border-radius: 10px; \r\n            border: 1px solid #ddd; box-sizing: border-box; font-size: 14px;
        }
        .search-box { border: 2px solid #eef0f2; margin-top: 10px; outline: none; }
        .search-box:focus { border-color: #6c757d; }

        /* Siswa Card */
        .siswa-card { 
            background: white; padding: 15px; border-radius: 15px; margin-bottom: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 10px;
        }
        .siswa-name { font-weight: 600; color: #333; font-size: 15px; }
        
        /* Opsi Radio Button Grid */
        .options-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .btn-radio { position: relative; text-align: center; }
        .btn-radio input[type="radio"] { 
            position: absolute; opacity: 0; width: 100%; height: 100%; top: 0; left: 0; cursor: pointer; 
        }
        .btn-radio label { 
            display: block; padding: 10px 0; font-size: 12px; font-weight: bold; 
            border-radius: 8px; background: #f8f9fa; color: #6c757d; border: 1px solid #e9ecef;
            transition: all 0.2s ease;
        }

        /* Warna Aktif Pilihan */
        .btn-radio input[value="Hadir"]:checked + label { background: var(--h); color: white; border-color: var(--h); }
        .btn-radio input[value="Sakit"]:checked + label { background: var(--i); color: white; border-color: var(--i); }
        .btn-radio input[value="Izin"]:checked + label { background: var(--s); color: white; border-color: var(--s); }
        .btn-radio input[value="Alpa"]:checked + label { background: var(--a); color: white; border-color: var(--a); }
        .btn-radio input[value="Dispen"]:checked + label { background: var(--d); color: white; border-color: var(--d); }

        /* Button Aksi Bawah Fixed */
        .footer-action { 
            position: fixed; bottom: 0; left: 0; right: 0; background: white; 
            padding: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); display: flex; justify-content: center;
        }
        .btn-submit { 
            width: 100%; max-width: 470px; background: #007bff; color: white; border: none; 
            padding: 15px; font-weight: bold; border-radius: 12px; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,123,255,0.3); transition: background 0.2s;
        }
        .btn-submit:hover { background: #0056b3; }
        .btn-submit:disabled { background: #b6d4fe; cursor: not-allowed; box-shadow: none; }
        
        #loading-txt { text-center: center; color: #888; font-style: italic; margin-top: 20px; display: none;}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h3 style="margin:0 0 15px 0; text-align:center; color:#222;">SmartAbsen Pro v2</h3>
        <select id="select-kelas" onchange="fetchSiswa()">
            <option value="">Memuat Kelas...</option>
        </select>
        <select id="select-mapel">
            <option value="">Memuat Mata Pelajaran...</option>
        </select>
        <input type="text" id="search" class="search-box" placeholder="Cari nama siswa..." onkeyup="filterSiswa()" disabled>
    </div>

    <div id="daftar-siswa"></div>
    <div id="loading-txt">Sedang mengambil daftar siswa...</div>
</div>

<div class="footer-action">
    <button class="btn-submit" id="btn-kirim-semua" onclick="kirimSemuaAbsensi()" disabled>KIRIM SEMUA ABSENSI</button>
</div>

<script>
    // ==========================================
    // PASTI KAN URL SCRIPT SUDAH RE-DEPLOY TERBARU
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/1UzqWGBKjHNcnBSz3UexIktAF7JY5-E13qiAo5AIXo2o/exec"; 

    // Fungsi Utama JSONP Penembus Hambatan CORS Browser
    function fetchJSONP(url, callbackFunc) {
        const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
        window[callbackName] = function(data) {
            delete window[callbackName];
            document.body.removeChild(script);
            callbackFunc(data);
        };
        const script = document.createElement('script');
        script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
        document.body.appendChild(script);
    }

    // 1. Ambil data Dropdown Awal secara otomatis saat web dibuka
    window.onload = function() {
        fetchJSONP(`${SCRIPT_URL}?action=getInitialData`, function(options) {
            if (options.error) {
                alert("Gagal memuat basis data awal: " + options.error);
                return;
            }
            const klsSelect = document.getElementById('select-kelas');
            const mplSelect = document.getElementById('select-mapel');
            
            klsSelect.innerHTML = '<option value="">-- PILIH KELAS --</option>';
            mplSelect.innerHTML = '<option value="">-- PILIH MAPEL --</option>';
            
            options.kelas.forEach(k => { klsSelect.innerHTML += `<option value="${k}">${k}</option>`; });
            options.mapel.forEach(m => { mplSelect.innerHTML += `<option value="${m}">${m}</option>`; });
        });
    };

    // 2. Ambil daftar siswa ketika opsi kelas dirubah
    function fetchSiswa() {
        const kls = document.getElementById('select-kelas').value;
        const container = document.getElementById('daftar-siswa');
        const loadTxt = document.getElementById('loading-txt');
        const searchInput = document.getElementById('search');
        const btnKirim = document.getElementById('btn-kirim-semua');

        container.innerHTML = "";
        searchInput.value = "";
        searchInput.disabled = true;
        btnKirim.disabled = true;

        if (!kls) return;

        loadTxt.style.display = "block";
        
        fetchJSONP(`${SCRIPT_URL}?action=getSiswa&kelas=${encodeURIComponent(kls)}`, function(listSiswa) {
            loadTxt.style.display = "none";
            if (listSiswa.error) {
                alert("Gagal memuat siswa: " + listSiswa.error);
                return;
            }

            if (listSiswa.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#888;'>Tidak ada siswa di kelas ini.</p>";
                return;
            }

            // Loop siswa dan buatkan kartu absensi radio button
            listSiswa.forEach((nama, index) => {
                container.innerHTML += `
                    <div class="siswa-card" data-nama="${nama}">
                        <div class="siswa-name">${index + 1}. ${nama}</div>
                        <div class="options-grid">
                            <div class="btn-radio">
                                <input type="radio" name="status-${index}" id="h-${index}" value="Hadir" checked>
                                <label for="h-${index}">H</label>
                            </div>
                            <div class="btn-radio">
                                <input type="radio" name="status-${index}" id="s-${index}" value="Sakit">
                                <label for="s-${index}">S</label>
                            </div>
                            <div class="btn-radio">
                                <input type="radio" name="status-${index}" id="i-${index}" value="Izin">
                                <label for="i-${index}">I</label>
                            </div>
                            <div class="btn-radio">
                                <input type="radio" name="status-${index}" id="a-${index}" value="Alpa">
                                <label for="a-${index}">A</label>
                            </div>
                            <div class="btn-radio">
                                <input type="radio" name="status-${index}" id="d-${index}" value="Dispen">
                                <label for="d-${index}">D</label>
                            </div>
                        </div>
                    </div>`;
            });

            searchInput.disabled = false;
            btnKirim.disabled = false;
        });
    }

    // 3. Fitur Pencarian Realtime Nama Siswa
    function filterSiswa() {
        const query = document.getElementById('search').value.toLowerCase();
        const cards = document.querySelectorAll('.siswa-card');
        cards.forEach(card => {
            const nama = card.getAttribute('data-nama').toLowerCase();
            card.style.display = nama.includes(query) ? "flex" : "none";
        });
    }

    // 4. Proses Kirim Massal Data Rekap Absen Kelas ke Google Sheets
    function kirimSemuaAbsensi() {
        const kls = document.getElementById('select-kelas').value;
        const mpl = document.getElementById('select-mapel').value;
        const cards = document.querySelectorAll('.siswa-card');
        const btn = document.getElementById('btn-kirim-semua');

        if (!kls || !mpl) {
            alert("Harap tentukan Kelas dan Mata Pelajaran terlebih dahulu!");
            return;
        }

        btn.innerText = "Mengirim Rekap Absensi..."; 
        btn.disabled = true;

        // Menyusun kumpulan data nama dan status menjadi satu paket data ringkas
        let rekapAbsen = [];
        cards.forEach(card => {
            const nama = card.getAttribute('data-nama');
            const status = card.querySelector('input[type="radio"]:checked').value;
            rekapAbsen.push({ n: nama, s: status }); // Menggunakan singkatan agar ukuran URL efisien
        });

        // Mengonversi data paket siswa menjadi string aman URL base64/JSON string
        const dataPayload = encodeURIComponent(JSON.stringify(rekapAbsen));
        const finalUrl = `${SCRIPT_URL}?action=bulkInsert&kelas=${encodeURIComponent(kls)}&mapel=${encodeURIComponent(mpl)}&rekap=${dataPayload}`;

        // Kirim menggunakan gerbang aman fetchJSONP
        fetchJSONP(finalUrl, function(result) {
            btn.innerText = "KIRIM SEMUA ABSENSI"; 
            btn.disabled = false;

            if (result.status === "success") {
                alert("🎉 Rekap absensi sukses dikirim dan disimpan ke Google Sheets!");
                cards.forEach(card => card.style.opacity = "0.5");
            } else {
                alert("Gagal menyimpan rekap: " + (result.error || "Terjadi kesalahan internal"));
            }
        });
    }
</script>

</body>
</html>
