<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAbsen Pro v2</title>
    <style>
    .menu-top-right {
    position: absolute; /* Gunakan 'fixed' jika ingin tombol tetap menempel di atas saat layar di-scroll */
    top: 20px;
    right: 20px;
    z-index: 9999; /* Memastikan tombol selalu berada di lapisan paling depan */
}

.btn-laporan {
    display: inline-block;
    padding: 10px 16px;
    background-color: #2563eb; /* Warna biru modern */
    color: #ffffff !important;
    text-decoration: none;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    transition: all 0.2s ease-in-out;
}

.btn-laporan:hover {
    background-color: #1d4ed8; /* Warna biru lebih gelap saat kursor di atasnya */
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    transform: translateY(-1px);
}

/* Penyesuaian tampilan untuk layar HP agar tidak terlalu besar */
@media (max-width: 480px) {
    .menu-top-right {
        top: 15px;
        right: 15px;
    }
    .btn-laporan {
        padding: 8px 12px;
        font-size: 12px;
        border-radius: 6px;
    }
}
        :root { --h: #28a745; --i: #ffc107; --s: #17a2b8; --a: #dc3545; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; padding: 15px; margin-bottom: 100px; }
        .container { max-width: 500px; margin: auto; }
        
        /* Header & Pilihan Menu */
        .header { background: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        select, .search-box { 
            width: 100%; padding: 12px; margin: 5px 0; border-radius: 10px; 
            border: 1px solid #ddd; box-sizing: border-box; font-size: 14px;
        }
        .search-box { border: 2px solid #eef0f2; margin-top: 10px; outline: none; }
        .search-box:focus { border-color: #007bff; }

        /* Tampilan Kartu Siswa */
        .card-siswa { 
            background: white; border-radius: 15px; padding: 20px; 
            margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center; transition: opacity 0.3s ease;
        }

        /* Bingkai Foto Rasio 3:4 */
        .photo-container {
            width: 100%;
            max-width: 160px;
            aspect-ratio: 3 / 4;
            margin: 0 auto 15px auto;
            overflow: hidden;
            border-radius: 12px;
            background: #f8f9fa;
            border: 1px solid #eee;
        }

        .photo { width: 100%; height: 100%; object-fit: cover; }

        .info h4 { margin: 10px 0 5px 0; color: #333; font-size: 17px; text-transform: uppercase; }
        .info small { color: #888; display: block; margin-bottom: 15px; }
        
        /* Tombol Pilihan Status (H, S, I, A) */
        .status-group { 
            display: flex; justify-content: space-around; 
            background: #fcfcfc; padding: 12px; border-radius: 10px;
            border: 1px solid #f0f0f0;
        }
        .status-item { font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .status-item input { transform: scale(1.2); }

        /* Tombol Kirim Melayang di Bawah */
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); text-align: center; z-index: 100; }
        .btn-kirim { width: 90%; max-width: 400px; background: #007bff; color: white; border: none; padding: 15px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .btn-kirim:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    
<div class="menu-top-right">
    <a href="laporan_absen.html" class="btn-laporan">
        📊 Laporan Absen
    </a>
</div>
    
<div class="container">
    <div class="header">
        <h2 style="margin:0 0 15px 0; text-align:center; color:#333;">SmartAbsen Pro</h2>
        <select id="pilih-kelas" onchange="filterSiswa()">
            <option value="">-- Pilih Kelas --</option>
        </select>
        <select id="pilih-mapel">
            <option value="">-- Pilih Mapel --</option>
        </select>
        <input type="text" id="cari-nama" class="search-box" placeholder="Cari nama siswa..." onkeyup="cariSiswa()">
    </div>

    <div id="daftar-siswa">
        <p style="text-align:center; color: #999; margin-top: 50px;">Memuat aplikasi, mohon tunggu...</p>
    </div>
</div>

<div class="footer">
    <button id="btn-kirim-semua" class="btn-kirim" onclick="kirimSemuaAbsen()">KIRIM SEMUA ABSENSI</button>
</div>

<script>
    // ==========================================
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyo2UpV5gX_c5JP9TWCYboJQpXDnJp_BIUafelk9cxf7OxdQfEbi2lxnKGlChyGpud5/exec"; 
    
    let dataMaster = [];

    // Mengubah tautan Google Drive biasa menjadi URL Thumbnail agar bisa dimuat di web
    function fixImageUrl(url) {
        if (!url || url.includes('placeholder')) return "https://via.placeholder.com/150x200?text=No+Foto";
        
        // Mengekstrak ID Unik File dari link Drive Anda
        const match = url.match(/[-\w]{25,}/);
        if (match && url.includes('drive.google.com')) {
            return `https://drive.google.com/thumbnail?authuser=0&sz=w1000&id=${match[0]}`;
        }
        return url;
    }

    // Mengambil data awal saat halaman web pertama kali dibuka
    async function loadData() {
        const container = document.getElementById('daftar-siswa');
        try {
            container.innerHTML = `<p style="text-align:center; color: #999; margin-top: 50px;">Memuat data dari Google Sheets...</p>`;
            
            const resp = await fetch(SCRIPT_URL);
            const data = await resp.json();
            
            if (data.error) throw new Error(data.error);

            dataMaster = data.siswa;
            
            // Mengisi Dropdown Pilihan Kelas
            const selKelas = document.getElementById('pilih-kelas');
            selKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
            data.kelas.forEach(k => { selKelas.innerHTML += `<option value="${k}">${k}</option>`; });
            
            // Mengisi Dropdown Pilihan Mapel
            const selMapel = document.getElementById('pilih-mapel');
            selMapel.innerHTML = '<option value="">-- Pilih Mapel --</option>';
            data.mapel.forEach(m => { selMapel.innerHTML += `<option value="${m}">${m}</option>`; });

            container.innerHTML = `<p style="text-align:center; color: #999; margin-top: 50px;">Silahkan pilih kelas...</p>`;
        } catch (e) { 
            console.error(e);
            container.innerHTML = `
                <div style="text-align:center; color: var(--a); margin-top: 50px; padding: 20px; background: white; border-radius: 15px;">
                    <h4>⚠️ Gagal Memuat Data</h4>
                    <p style="font-size: 13px; color: #666;">${e.message}</p>
                    <small style="color:#999;">Pastikan Apps Script Anda di-deploy ulang sebagai 'Web App' dengan akses 'Anyone'.</small>
                </div>`;
        }
    }

    // Menampilkan daftar siswa sesuai dengan kelas yang dipilih pengguna
    function filterSiswa() {
        const kls = document.getElementById('pilih-kelas').value;
        const container = document.getElementById('daftar-siswa');
        container.innerHTML = "";
        document.getElementById('cari-nama').value = ""; // Bersihkan kolom pencarian tiap ganti kelas

        if (!kls) {
            container.innerHTML = `<p style="text-align:center; color: #999; margin-top: 50px;">Silahkan pilih kelas...</p>`;
            return;
        }

        // Menyaring data siswa berdasarkan kolom C (kelas siswa) yang cocok dengan dropdown
        const filtered = dataMaster.filter(s => s.kelas === kls);
        if (filtered.length === 0) {
            container.innerHTML = `<p style="text-align:center; color: var(--a); margin-top: 50px;">Tidak ada siswa terdaftar di kelas ini.</p>`;
            return;
        }

        // Tampilkan kartu data siswa ke layar
        filtered.forEach((s, index) => {
            container.innerHTML += `
            <div class="card-siswa" data-nama="${s.nama}">
                <div class="photo-container">
                    <img src="${fixImageUrl(s.foto)}" class="photo" loading="lazy" referrerpolicy="no-referrer">
                </div>
                <div class="info">
                    <h4>${s.nama}</h4>
                    <small>ID: ${s.id || '-'}</small>
                </div>
                <div class="status-group">
                    <label class="status-item" style="color:var(--h)"><input type="radio" name="st-${index}" value="Hadir" checked> H</label>
                    <label class="status-item" style="color:var(--d)"><input type="radio" name="st-${index}" value="Dispen"> D</label>
                    <label class="status-item" style="color:var(--s)"><input type="radio" name="st-${index}" value="Sakit"> S</label>
                    <label class="status-item" style="color:var(--i)"><input type="radio" name="st-${index}" value="Izin"> I</label>
                    <label class="status-item" style="color:var(--a)"><input type="radio" name="st-${index}" value="Alpa"> A</label>
                </div>
            </div>`;
        });
    }

    // Fitur Pencarian Nama Siswa Secara Real-time
    function cariSiswa() {
        const keyword = document.getElementById('cari-nama').value.toLowerCase();
        const cards = document.getElementsByClassName('card-siswa');
        for (let card of cards) {
            const nama = card.getAttribute('data-nama').toLowerCase();
            card.style.display = nama.includes(keyword) ? "" : "none";
        }
    }

    // Mengirim seluruh status absensi satu kelas sekaligus ke Google Sheet (Batch POST)
    async function kirimSemuaAbsen() {
        const kls = document.getElementById('pilih-kelas').value;
        const mpl = document.getElementById('pilih-mapel').value;
        if(!kls || !mpl) return alert("Silakan pilih Kelas dan Mapel terlebih dahulu!");
        
        const cards = document.querySelectorAll('.card-siswa');
        if(cards.length === 0) return alert("Tidak ada data siswa untuk dikirim.");
        if(!confirm(`Kirim rekap absensi untuk ${cards.length} siswa kelas ${kls}?`)) return;

        const btn = document.getElementById('btn-kirim-semua');
        btn.innerText = "Mengirim Rekap Absensi..."; 
        btn.disabled = true;

        // Kumpulkan data nama dan status pilihan radio button ke bentuk Array objek
        let rekapAbsen = [];
        cards.forEach(card => {
            const nama = card.getAttribute('data-nama');
            const status = card.querySelector('input[type="radio"]:checked').value;
            rekapAbsen.push({ nama: nama, status: status });
        });

        try {
            // Mengirim data paket lengkap ke Google Apps Script
            const response = await fetch(SCRIPT_URL, { 
                method: 'POST',
                body: JSON.stringify({ kelas: kls, mapel: mpl, data: rekapAbsen }) 
            });
            
            const result = await response.json();
            if (result.result === "error") throw new Error(result.message);
            
            alert("🎉 Rekap absensi sukses dikirim dan disimpan ke Google Sheets!");
            cards.forEach(card => card.style.opacity = "0.5"); // Memberikan efek transparan tanda selesai
        } catch(e) { 
            console.error(e); 
            alert("Terjadi kesalahan saat mengirim data: " + e.message);
        } finally {
            btn.innerText = "KIRIM SEMUA ABSENSI"; 
            btn.disabled = false;
        }
    }

    // Jalankan pemuatan data secara otomatis saat halaman web terbuka sempurna
    window.onload = loadData;
</script>
</body>
</html>
